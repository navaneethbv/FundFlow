# SonarQube Cloud project identity is supplied by the GitHub workflow from the
# repository context, so personal account identifiers are not stored here.

sonar.sources=app,components,lib,scripts
sonar.tests=tests
# scripts/ is operator-run tooling (restore-backup.mjs, check-rls.sql), not
# application code. It takes file paths from the operator's own command line by
# design, which the taint rules read as unvalidated path traversal.
sonar.exclusions=**/*.test.ts,supabase/migrations/**,scripts/**

# Written by `npm run test:coverage`.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Coverage is measured on logic modules only, mirroring the coverage `include`
# in vitest.config.ts (lib/**, app/api/**, plus the .ts chart/dashboard logic).
# React pages/components (**/*.tsx) are presentational and untested by design;
# without this they report 0% to Sonar and sink the new-code coverage gate even
# though nothing about them is untested-by-accident. These files are still
# scanned for bugs/security/duplication (that is sonar.exclusions, not this);
# only the coverage metric skips them. Chart/dashboard render behaviour is
# exercised by tests/unit/charts-render.test.ts under vitest regardless.
sonar.coverage.exclusions=app/**/*.tsx,components/**/*.tsx,app/manifest.ts,app/auth/callback/route.ts,lib/types.ts

# S1082 ("visible non-interactive element with a click handler needs a
# keyboard listener") false-positives on two deliberately non-focusable
# elements whose keyboard path is already implemented elsewhere: Modal's
# backdrop <div> (Escape closes it, via useDialogFocus; the backdrop itself
# stays out of the tab order on purpose) and CommandPalette's option <li>
# (arrow-key/Enter navigation lives on the owning <input>, per the combobox
# pattern with aria-activedescendant — see the comments at each site).
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S1082
sonar.issue.ignore.multicriteria.e1.resourceKey=components/ui/Modal.tsx
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S1082
sonar.issue.ignore.multicriteria.e2.resourceKey=components/CommandPalette.tsx
