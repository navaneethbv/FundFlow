name: SonarQube Cloud

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read # lets SonarQube Cloud decorate PRs with analysis results

jobs:
  analysis:
    # SONAR_TOKEN is withheld from Dependabot and fork PRs, so the scan cannot
    # authenticate there. Skip instead of failing; main is still analyzed on push.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # shallow clones degrade new-code detection

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test with coverage
        run: npm run test:coverage
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-placeholder

      - name: Scan
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          # sonar-scanner-cli 8.x tries to provision its own JRE from
          # api.sonarcloud.io/analysis/jres when it judges the embedded JRE
          # unsuitable, and that endpoint rejects the analysis token with a 403.
          # The bundle ships a JRE (and the runner has none), so skip
          # provisioning and let the scanner use the bundled JRE.
          args: >-
            -Dsonar.scanner.skipJreProvisioning=true
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}
            -Dsonar.organization=${{ github.repository_owner }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
