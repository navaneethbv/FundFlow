name: Migration smoke-check

on:
  pull_request:
    paths:
      - ".github/workflows/migration-check.yml"
      - "supabase/migrations/**"
      - "scripts/check-rls.sql"
      - "scripts/check-financial-writes.sql"
      - "scripts/check-transaction-review.sql"
      - "tests/integration/transaction-review-locks.test.ts"

permissions:
  contents: read

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      SUPABASE_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.110.0

      - name: Start Supabase local stack
        run: supabase start

      - name: Apply every migration from a clean database
        run: supabase db reset --local --no-seed

      - name: Assert RLS on every public table
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/check-rls.sql

      - name: Verify atomic financial writes and reconciliation permissions
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/check-financial-writes.sql

      - name: Verify transaction review states and atomic permissions
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/check-transaction-review.sql

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install transaction contention test dependencies
        run: npm ci

      - name: Verify transaction review under real row contention
        run: npx vitest run tests/integration/transaction-review-locks.test.ts
        env:
          TEST_TRANSACTION_REVIEW_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      - name: Stop Supabase local stack
        if: always()
        run: supabase stop --no-backup || true
