name: Migration smoke-check

on:
  pull_request:
    paths:
      - ".github/workflows/migration-check.yml"
      - "supabase/migrations/**"
      - "scripts/check-rls.sql"

permissions:
  contents: read

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.0

      - name: Start Supabase local stack
        run: supabase start

      - name: Apply every migration from a clean database
        run: supabase db reset --local --no-seed

      - name: Assert RLS on every public table
        run: supabase db query --local --file scripts/check-rls.sql

      - name: Stop Supabase local stack
        if: always()
        run: supabase stop --no-backup || true
