name: Migration smoke-check

on:
  pull_request:
    paths:
      - ".github/workflows/migration-check.yml"
      - "supabase/migrations/**"
      - "scripts/check-rls.sql"

permissions:
  contents: read

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      SUPABASE_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.110.0

      - name: Start Supabase local stack
        run: supabase start

      - name: Apply every migration from a clean database
        run: supabase db reset --local --no-seed

      - name: Assert RLS on every public table
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/check-rls.sql

      - name: Stop Supabase local stack
        if: always()
        run: supabase stop --no-backup || true
